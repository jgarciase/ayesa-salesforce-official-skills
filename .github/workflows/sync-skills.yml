name: Sync Salesforce skills

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream git ref (branch, tag, or commit)
        required: false
        default: main
      force:
        description: Force re-clone vendor cache
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Weekly check for upstream updates (Monday 06:00 UTC)
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync skills from forcedotcom/sf-skills
        shell: pwsh
        run: |
          $params = @{ Ref = "${{ github.event.inputs.ref || 'main' }}" }
          if ("${{ github.event.inputs.force }}" -eq "true") { $params["Force"] = $true }
          $previous = (Get-Content ./skills-lock.json -Raw | ConvertFrom-Json).commit
          ./scripts/sync-skills.ps1 @params
          $current = (Get-Content ./skills-lock.json -Raw | ConvertFrom-Json).commit
          if ($previous -eq $current) {
            Write-Host "Upstream sin cambios ($current); se descartan diferencias de formato/fecha."
            git restore .
            git status --short
          }

      - name: Commit and push to main
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "Sin cambios que subir."
            exit 0
          }
          $lock = Get-Content ./skills-lock.json -Raw | ConvertFrom-Json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync skills from forcedotcom/sf-skills v$($lock.version) ($($lock.commit.Substring(0,7)))"
          git push origin HEAD:${{ github.ref_name }}